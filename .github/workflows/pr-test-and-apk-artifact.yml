name: PR Test and APK Artifact

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Run tests
        run: ./gradlew --no-daemon test

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: test
    env:
      CI_VERSION_CODE: ${{ github.event.pull_request.number }}
      CI_VERSION_NAME: 0.1.0-pr.${{ github.event.pull_request.number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build debug APK
        run: ./gradlew --no-daemon -PciVersionCode="${CI_VERSION_CODE}" -PciVersionName="${CI_VERSION_NAME}" :app:assembleDebug

      - name: Set artifact name
        id: artifact_meta
        run: |
          short_sha="$(git rev-parse --short=8 HEAD)"
          artifact_name="midoriai-radio-debug-pr-${{ github.event.pull_request.number }}-${short_sha}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_meta.outputs.artifact_name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
