name: PR APK Download Comment

on:
  workflow_run:
    workflows:
      - PR Test and APK Artifact
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  publish:
    name: Link successful APK builds
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Post or update the PR download link
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: run.id, per_page: 100,
            });
            const matches = artifacts
              .filter(artifact => !artifact.expired)
              .map(artifact => ({
                artifact,
                match: /^midoriai-radio-debug-pr-(\d+)-([0-9a-f]{8})$/.exec(artifact.name),
              }))
              .filter(({ match }) => match && match[2] === run.head_sha.slice(0, 8));

            if (matches.length !== 1) {
              core.info(`Expected one APK artifact from run ${run.id}; found ${matches.length}.`);
              return;
            }

            const { artifact, match } = matches[0];
            const pull_number = Number(match[1]);
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.state !== 'open' || pr.base.ref !== 'main') {
              core.info('Pull request is no longer open against main.');
              return;
            }
            // For pull_request runs the checked-out SHA is normally the test merge commit.
            // Reject stale or unrelated runs before updating a visible PR download.
            if (run.head_sha !== pr.merge_commit_sha && run.head_sha !== pr.head.sha) {
              core.info('Build SHA no longer matches the current pull request.');
              return;
            }
            if (run.pull_requests?.length &&
                !run.pull_requests.some(p => p.number === pull_number)) {
              core.info('Workflow run is associated with another pull request.');
              return;
            }

            const marker = '<!-- midoriai-pr-apk-download -->';
            const artifactUrl = `https://github.com/${owner}/${repo}/actions/runs/${run.id}/artifacts/${artifact.id}`;
            const body = [
              marker,
              '### Android test APK',
              `**[Download test APK (ZIP)](${artifactUrl})**`,
              `Built for PR #${pull_number} from commit \`${run.head_sha.slice(0, 8)}\` ([build run](${run.html_url})).`,
              'Extract `app-debug.apk` from the ZIP and install it on your Android device.',
              '_GitHub may require sign-in to download artifacts; links expire according to repository artifact retention settings._',
            ].join('\n\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pull_number, body,
              });
            }
