name: Radio App Daily Beta

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect_updates:
    name: Detect repository updates
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.changes.outputs.should_build }}
      change_count: ${{ steps.changes.outputs.change_count }}
      build_reason: ${{ steps.changes.outputs.build_reason }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare release metadata
        id: meta
        run: |
          short_sha="$(git rev-parse --short=8 HEAD)"
          release_tag="beta-${{ github.run_number }}-${short_sha}"

          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Decide whether this run should build
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          change_count=0
          should_build=false
          build_reason=""

          if [ "${EVENT_NAME}" = "schedule" ]; then
            change_count="$(git rev-list --count --since='24 hours ago' HEAD)"

            if git tag --points-at HEAD 'beta-*' | grep -q .; then
              build_reason="HEAD already has a beta release tag"
            elif [ "${change_count}" -gt 0 ]; then
              should_build=true
              build_reason="scheduled run found recent commits"
            else
              build_reason="no commits in the last 24 hours"
            fi
          else
            should_build=true
            build_reason="${EVENT_NAME} always builds"
          fi

          echo "change_count=${change_count}" >> "${GITHUB_OUTPUT}"
          echo "should_build=${should_build}" >> "${GITHUB_OUTPUT}"
          echo "build_reason=${build_reason}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Beta build check"
            echo "- Event: ${EVENT_NAME}"
            echo "- Commits in last 24 hours: ${change_count}"
            echo "- Should build: ${should_build}"
            echo "- Reason: ${build_reason}"
          } >> "${GITHUB_STEP_SUMMARY}"

  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs: detect_updates
    if: needs.detect_updates.outputs.should_build == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Run tests
        run: ./gradlew --no-daemon test

  build_and_release:
    name: Build and publish beta
    runs-on: ubuntu-latest
    needs:
      - detect_updates
      - test
    if: needs.detect_updates.outputs.should_build == 'true' && needs.test.result == 'success'
    env:
      CI_VERSION_CODE: ${{ github.run_number }}
      CI_VERSION_NAME: 0.1.0-beta.${{ github.run_number }}-${{ needs.detect_updates.outputs.short_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Build debug APK
        run: ./gradlew --no-daemon -PciVersionCode="${CI_VERSION_CODE}" -PciVersionName="${CI_VERSION_NAME}" :app:assembleDebug

      - name: Set artifact name
        id: artifact_meta
        run: |
          artifact_name="midoriai-radio-debug-${{ github.run_number }}-${{ needs.detect_updates.outputs.short_sha }}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_meta.outputs.artifact_name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.detect_updates.outputs.release_tag }}
          RELEASE_NAME: Beta ${{ github.run_number }} (${{ needs.detect_updates.outputs.short_sha }})
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; skipping publish."
            exit 0
          fi

          gh release create "${RELEASE_TAG}" app/build/outputs/apk/debug/*.apk \
            --title "${RELEASE_NAME}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --generate-notes
